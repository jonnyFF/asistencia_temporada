<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:20px;text-align:center}
.contenedor{width:100%;max-width:500px;margin:0 auto;background:#fff;padding:25px;border-radius:12px}
label{display:block;margin-top:18px;font-weight:bold}
input{width:100%;padding:12px;margin-top:7px;font-size:16px;border:1px solid #aaa;border-radius:7px}
button{padding:13px 24px;margin-top:24px;font-size:16px;cursor:pointer;border:1px solid #777;border-radius:8px}
button:disabled{opacity:.5;cursor:not-allowed}
#mensaje{margin-top:20px}
</style>
</head>
<body>
<main class="contenedor">
<h2>Configuración del administrador</h2>

<label for="clave">Contraseña</label>
<input type="password" id="clave" autocomplete="current-password">

<label for="planilla">Enlace de Google Sheets</label>
<input type="url" id="planilla" placeholder="Pegue el enlace de la planilla">

<label for="carpetaDrive">Enlace de la carpeta de Google Drive</label>
<input type="url" id="carpetaDrive" placeholder="Pegue el enlace de la carpeta">

<label for="nombreHoja">Nombre de la hoja</label>
<input type="text" id="nombreHoja" value="Hoja 1">

<button id="btnGuardar" type="button">Guardar configuración</button>
<div id="mensaje"></div>
</main>

<script>
const URL_SCRIPT="https://script.google.com/macros/s/AKfycbxaDDToHZxiQgilvfk17bqfEbVsgwFg1yMd266YQyt1QU-ISruml20uMfDHxxjz88IrCQ/exec";

const btnGuardar=document.getElementById("btnGuardar");
btnGuardar.addEventListener("click",guardarConfiguracion);

async function guardarConfiguracion(){
 const clave=document.getElementById("clave").value.trim();
 const planilla=document.getElementById("planilla").value.trim();
 const carpetaDrive=document.getElementById("carpetaDrive").value.trim();
 const nombreHoja=document.getElementById("nombreHoja").value.trim();
 const mensaje=document.getElementById("mensaje");

 if(!clave||!planilla||!carpetaDrive||!nombreHoja){
  mensaje.innerHTML="<h3>Complete todos los campos.</h3>";
  return;
 }

 btnGuardar.disabled=true;
 mensaje.innerHTML="<h3>Guardando configuración...</h3>";

 try{
  const respuesta=await fetch(URL_SCRIPT,{
   method:"POST",
   body:JSON.stringify({
    accion:"GUARDAR_CONFIG",
    clave:clave,
    planilla:planilla,
    carpetaDrive:carpetaDrive,
    nombreHoja:nombreHoja
   })
  });

  const texto=await respuesta.text();
  let datos;

  try{
   datos=JSON.parse(texto);
  }catch(error){
   throw new Error("La respuesta del servicio no es válida.");
  }

  if(datos.ok){
   mensaje.innerHTML="<h3>Configuración guardada correctamente.</h3>";
   document.getElementById("clave").value="";
  }else if(datos.mensaje==="CLAVE_INCORRECTA"){
   mensaje.innerHTML="<h3>Contraseña incorrecta.</h3>";
  }else if(datos.mensaje==="ADMIN_CLAVE_NO_CONFIGURADA"){
   mensaje.innerHTML="<h3>Falta configurar ADMIN_CLAVE en Apps Script.</h3>";
  }else{
   mensaje.innerHTML="<h3>Error al guardar.</h3><p>"+(datos.error||datos.mensaje||"Error desconocido")+"</p>";
  }
 }catch(error){
  mensaje.innerHTML="<h3>Error de conexión.</h3><p>"+error.message+"</p>";
 }finally{
  btnGuardar.disabled=false;
 }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmación de Asistencia</title>

<script src="https://unpkg.com/@zxing/library@latest"></script>

<style>

body{
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
}

button{
    padding: 12px 20px;
    font-size: 16px;
    margin: 5px;
    cursor: pointer;
}

input{
    padding: 10px;
    font-size: 16px;
    text-align: center;
}

#reader{
    display:block;
    margin:auto;
}

</style>

</head>

<body>

<h2>Confirmación de Asistencia</h2>

<button id="btnEscanear" onclick="iniciarCamara()">Escanear DNI</button>

<br><br>

<button id="btnManual" onclick="mostrarManual()">No tengo mi DNI</button>

<input type="hidden" id="dni">

<div id="manual" style="display:none; margin-top:20px;">

    <p>Ingrese su DNI</p>

    <input type="number" id="dniManual">

    <br><br>

    <button onclick="buscarManual()">Continuar</button>

</div>

<br><br>

<div id="estado"></div>

<video id="reader" width="320" height="240" style="border:1px solid #ccc;"></video>

<br><br>

<div id="resultado"></div>

<script>

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbxUtipWdjYRXvc9hb3zVdkVrJfgpKr-dmLxPM8vj5pikhvnT7wHr_W5v89WHXJV5ZNKDA/exec";

let modoIngreso = "DNI";

function mostrarManual() {

    modoIngreso = "MANUAL";

    document.getElementById("btnEscanear").disabled = true;

    document.getElementById("manual").style.display = "block";

}

function buscarManual() {

    let dni = document.getElementById("dniManual").value;

    document.getElementById("dni").value = dni;

    buscarDni();

}

function iniciarCamara() {

    modoIngreso = "DNI";

    document.getElementById("btnManual").disabled = true;

    document.getElementById("estado").innerHTML =
        "<h3>Escaneando DNI...</h3>";

    const codeReader = new ZXing.BrowserMultiFormatReader();

    codeReader.decodeFromVideoDevice(
        null,
        'reader',
        (result, err) => {

            if (result) {

                let texto = result.text;

                let partes = texto.split("@");

                let dni = "";

                for (let i = 0; i < partes.length; i++) {

                    let valor = partes[i].trim();

                    if (/^\d{7,8}$/.test(valor)) {

                        dni = valor;

                    }

                }

                if (dni === "") {

                    document.getElementById("estado").innerHTML =
                        "<h3>No se pudo identificar el DNI</h3>";

                    document.getElementById("btnManual").disabled = false;

                    return;

                }

                document.getElementById("dni").value = dni;

                document.getElementById("estado").innerHTML =
                    "<h3>Buscando invitado...</h3>";

                codeReader.reset();

                buscarDni();

            }

        }
    );

}

function buscarDni() {

    let dni = document.getElementById("dni").value;

    fetch(URL_SCRIPT + "?dni=" + dni)
    .then(response => response.json())
    .then(data => {

        if (data.encontrado) {

            document.getElementById("estado").innerHTML = "";

            document.getElementById("resultado").innerHTML =
                "<h3>Invitado encontrado</h3>" +
                "<p><strong>Nombre:</strong> " + data.nombre + "</p>" +
                "<p><strong>DNI:</strong> " + data.dni + "</p>" +
                "<button onclick=\"responder('" + data.dni + "','ASISTE')\">Asistiré</button>" +
                "<br><br>" +
                "<button onclick=\"responder('" + data.dni + "','NO ASISTE')\">No asistiré</button>";

        } else {

            document.getElementById("estado").innerHTML = "";

            document.getElementById("resultado").innerHTML =
                "<h3>DNI no autorizado</h3>";

        }

    });

}

function responder(dni, asistencia) {

    fetch(URL_SCRIPT, {
        method: "POST",
        body: JSON.stringify({
            dni: dni,
            asistencia: asistencia,
            modoIngreso: modoIngreso
        })
    })
    .then(response => response.json())
    .then(data => {

        if (data.ok) {

            document.getElementById("resultado").innerHTML =
                "<h3>✅ Respuesta registrada correctamente</h3>";

        } else {

            if (data.mensaje == "YA_RESPONDIO") {

                document.getElementById("resultado").innerHTML =
                    "<h3>Este DNI ya registró una respuesta.</h3>";

            } else {

                document.getElementById("resultado").innerHTML =
                    "<h3>Error al guardar la respuesta.</h3>";

            }

        }

    });

}

</script>

</body>
</html>

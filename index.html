<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmación Inicio de temporada</title>
<script src="https://unpkg.com/@zxing/library@latest"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;text-align:center;margin:0;padding:20px;background:#f5f5f5}
.contenedor{width:100%;max-width:440px;margin:0 auto;padding:22px;background:#fff;border-radius:12px;position:relative}
button{padding:12px 20px;font-size:16px;margin:6px;cursor:pointer;border:1px solid #777;border-radius:8px}
button:disabled{opacity:.5;cursor:not-allowed}
input{width:100%;max-width:260px;padding:11px;font-size:18px;text-align:center}
video,img{display:block;margin:12px auto;border:1px solid #ccc;border-radius:8px;object-fit:cover}
#reader{display:none;width:100%;max-width:320px;height:240px}
#videoSelfie,#previewSelfie{width:160px;height:120px}
#manual,#zonaSelfie{display:none}
#estado,#resultado{margin-top:18px}
#btnAdmin{position:absolute;top:8px;right:8px;padding:8px 10px;margin:0;font-size:20px;background:transparent;border:none;cursor:pointer}
</style>
</head>
<body>
<main class="contenedor">
<button id="btnAdmin" type="button" title="Acceso de administrador" aria-label="Acceso de administrador">🔐</button>
<h2>Confirmación Inicio de temporada</h2>
<div id="opciones">
<button id="btnEscanear" type="button">Escanear DNI</button><br>
<button id="btnManual" type="button">No tengo mi DNI</button>
</div>
<input type="hidden" id="dni">
<div id="manual">
<p>Ingrese su DNI</p>
<input type="number" id="dniManual" inputmode="numeric" placeholder="Número de DNI"><br><br>
<button id="btnContinuar" type="button">Continuar</button>
</div>
<div id="estado"></div>
<video id="reader" width="320" height="240" playsinline></video>
<div id="datosInvitado"></div>
<div id="zonaSelfie">
<h3>Tomar selfie</h3>
<video id="videoSelfie" width="160" height="120" autoplay playsinline></video>
<button id="btnTomarSelfie" type="button">Tomar selfie</button>
<canvas id="canvasSelfie" width="160" height="120" hidden></canvas>
<img id="previewSelfie" width="160" height="120" alt="Vista previa de la selfie" hidden>
<p id="selfieLista" hidden>Selfie tomada correctamente.</p>
</div>
<div id="resultado"></div>
</main>
<script>
const URL_SCRIPT="https://script.google.com/macros/s/AKfycbxaDDToHZxiQgilvfk17bqfEbVsgwFg1yMd266YQyt1QU-ISruml20uMfDHxxjz88IrCQ/exec";
let modoIngreso="DNI";
let fotoBase64="";
let streamSelfie=null;
let codeReader=null;
const btnAdmin=document.getElementById("btnAdmin");
const btnEscanear=document.getElementById("btnEscanear");
const btnManual=document.getElementById("btnManual");
const btnContinuar=document.getElementById("btnContinuar");
const btnTomarSelfie=document.getElementById("btnTomarSelfie");
btnAdmin.addEventListener("click",()=>{window.location.href="admin.html";});
btnEscanear.addEventListener("click",iniciarCamara);
btnManual.addEventListener("click",mostrarManual);
btnContinuar.addEventListener("click",buscarManual);
btnTomarSelfie.addEventListener("click",capturarSelfie);
function mostrarManual(){
 modoIngreso="MANUAL";btnEscanear.disabled=true;btnManual.disabled=true;
 document.getElementById("manual").style.display="block";
}
function buscarManual(){
 const dni=document.getElementById("dniManual").value.trim();
 if(!/^\d{7,8}$/.test(dni)){document.getElementById("resultado").innerHTML="<h3>Ingrese un DNI válido de 7 u 8 números.</h3>";return;}
 document.getElementById("dni").value=dni;buscarDni();
}
function extraerDni(texto){
 const candidatos=String(texto).split("@").map(v=>v.trim()).filter(v=>/^\d{7,8}$/.test(v));
 if(candidatos.length)return candidatos[candidatos.length-1];
 const encontrados=String(texto).match(/(?:^|\D)(\d{7,8})(?:\D|$)/g);
 if(!encontrados)return "";
 const numeros=encontrados.map(v=>v.replace(/\D/g,"")).filter(v=>/^\d{7,8}$/.test(v));
 return numeros.length?numeros[numeros.length-1]:"";
}
function iniciarCamara(){
 modoIngreso="DNI";btnManual.disabled=true;btnEscanear.disabled=true;
 document.getElementById("reader").style.display="block";
 document.getElementById("estado").innerHTML="<h3>Escaneando DNI...</h3>";
 if(typeof ZXing==="undefined"){document.getElementById("estado").innerHTML="<h3>No se pudo cargar el lector.</h3>";return;}
 codeReader=new ZXing.BrowserMultiFormatReader();
 codeReader.decodeFromVideoDevice(null,"reader",result=>{
  if(!result)return;
  const texto=result.text||(result.getText?result.getText():"");
  const dni=extraerDni(texto);
  if(!dni){document.getElementById("estado").innerHTML="<h3>No se pudo identificar el DNI.</h3>";return;}
  document.getElementById("dni").value=dni;codeReader.reset();
  document.getElementById("reader").style.display="none";buscarDni();
 });
}
async function iniciarSelfie(){
 document.getElementById("zonaSelfie").style.display="block";
 document.getElementById("videoSelfie").style.display="block";
 try{
  streamSelfie=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:240},height:{ideal:180}},audio:false});
  document.getElementById("videoSelfie").srcObject=streamSelfie;
 }catch(e){document.getElementById("zonaSelfie").innerHTML="<h3>No se pudo abrir la cámara frontal.</h3>";}
}
function capturarSelfie(){
 const video=document.getElementById("videoSelfie");
 const canvas=document.getElementById("canvasSelfie");
 const ctx=canvas.getContext("2d");
 ctx.drawImage(video,0,0,160,120);
 const imagen=canvas.toDataURL("image/jpeg",0.25);
 fotoBase64=imagen.split(",")[1];
 const preview=document.getElementById("previewSelfie");
 preview.src=imagen;preview.hidden=false;
 document.getElementById("selfieLista").hidden=false;
 video.style.display="none";btnTomarSelfie.disabled=true;
 if(streamSelfie)streamSelfie.getTracks().forEach(t=>t.stop());
}
function buscarDni(){
 const dni=document.getElementById("dni").value;
 document.getElementById("estado").innerHTML="<h3>Buscando datos...</h3>";
 fetch(URL_SCRIPT+"?dni="+encodeURIComponent(dni)).then(r=>r.json()).then(data=>{
  document.getElementById("estado").innerHTML="";
  if(!data.encontrado){document.getElementById("resultado").innerHTML="<h3>DNI no autorizado</h3>";return;}
  document.getElementById("opciones").style.display="none";
  document.getElementById("manual").style.display="none";
  document.getElementById("reader").style.display="none";
  document.getElementById("datosInvitado").innerHTML="<h3>Datos encontrados</h3><p><strong>Nombre:</strong> "+data.nombre+"</p><p><strong>DNI:</strong> "+data.dni+"</p>";
  if(modoIngreso==="MANUAL")iniciarSelfie();
  document.getElementById("resultado").innerHTML="<button id='btnAsiste' type='button'>Asistiré</button><br><br><button id='btnNoAsiste' type='button'>No asistiré</button>";
  document.getElementById("btnAsiste").addEventListener("click",()=>responder(data.dni,"ASISTE"));
  document.getElementById("btnNoAsiste").addEventListener("click",()=>responder(data.dni,"NO ASISTE"));
 }).catch(()=>{document.getElementById("estado").innerHTML="";document.getElementById("resultado").innerHTML="<h3>Error al consultar el DNI.</h3>";});
}
function responder(dni,asistencia){
 if(modoIngreso==="MANUAL"&&!fotoBase64){alert("Debe tomar una selfie antes de responder.");return;}
 document.querySelectorAll("#resultado button").forEach(b=>b.disabled=true);
 document.getElementById("estado").innerHTML="<h3>Guardando respuesta...</h3>";
 fetch(URL_SCRIPT,{method:"POST",body:JSON.stringify({dni,asistencia,modoIngreso,foto:fotoBase64})}).then(r=>r.json()).then(data=>{
  document.getElementById("estado").innerHTML="";
  if(data.ok){document.getElementById("datosInvitado").innerHTML="";document.getElementById("zonaSelfie").style.display="none";document.getElementById("resultado").innerHTML="<h2>Gracias</h2><p>Su respuesta fue registrada correctamente.</p>";}
  else if(data.mensaje==="YA_RESPONDIO"){document.getElementById("resultado").innerHTML="<h3>Este DNI ya registró una respuesta.</h3>";}
  else{document.getElementById("resultado").insertAdjacentHTML("beforeend","<h3>Error al guardar la respuesta.</h3>");}
 }).catch(()=>{document.getElementById("estado").innerHTML="";document.getElementById("resultado").insertAdjacentHTML("beforeend","<h3>Error de conexión.</h3>");});
}
</script>
</body>
</html>

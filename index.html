<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirmación de Asistencia</title>
<script src="https://unpkg.com/@zxing/library@latest"></script>
<style>
*{box-sizing:border-box} body{font-family:Arial,sans-serif;text-align:center;margin:0;padding:20px;background:#f5f5f5}
.contenedor{width:100%;max-width:440px;margin:auto;padding:22px;background:#fff;border-radius:12px;position:relative}
button{padding:12px 20px;font-size:16px;margin:6px;cursor:pointer;border:1px solid #777;border-radius:8px}
button:disabled{opacity:.5} input{width:100%;max-width:260px;padding:11px;font-size:18px;text-align:center}
video,img{display:block;margin:12px auto;border:1px solid #ccc;border-radius:8px;object-fit:cover}
#reader{display:none;width:100%;max-width:320px;height:240px} #videoSelfie,#previewSelfie{width:160px;height:120px}
#manual,#zonaSelfie{display:none} #estado,#resultado{margin-top:18px}
#btnAdmin{position:absolute;right:10px;top:10px;padding:7px 10px;font-size:20px;background:transparent;border:none}
</style>
</head>
<body><main class="contenedor">
<button id="btnAdmin" type="button" title="Acceso protegido">🔐</button>
<h2>Confirmación de Asistencia</h2>
<div id="opciones"><button id="btnEscanear">Escanear DNI</button><br><button id="btnManual">No tengo mi DNI</button></div>
<input type="hidden" id="dni">
<div id="manual"><p>Ingrese su DNI</p><input type="number" id="dniManual" inputmode="numeric"><br><br><button id="btnContinuar">Continuar</button></div>
<div id="estado"></div><video id="reader" width="320" height="240" playsinline></video><div id="datosInvitado"></div>
<div id="zonaSelfie"><h3>Tomar selfie</h3><video id="videoSelfie" width="160" height="120" autoplay playsinline></video><button id="btnTomarSelfie">Tomar selfie</button><canvas id="canvasSelfie" width="160" height="120" hidden></canvas><img id="previewSelfie" width="160" height="120" hidden><p id="selfieLista" hidden>Selfie tomada correctamente.</p></div>
<div id="resultado"></div></main>
<script>
const URL_SCRIPT="https://script.google.com/macros/s/AKfycbxaDDToHZxiQgilvfk17bqfEbVsgwFg1yMd266YQyt1QU-ISruml20uMfDHxxjz88IrCQ/exec";
let modoIngreso="DNI",fotoBase64="",streamSelfie=null,codeReader=null;
const $=id=>document.getElementById(id);
$("btnAdmin").onclick=accesoAdministrador; $("btnEscanear").onclick=iniciarCamara; $("btnManual").onclick=mostrarManual; $("btnContinuar").onclick=buscarManual; $("btnTomarSelfie").onclick=capturarSelfie;
async function accesoAdministrador(){
 const clave=prompt("Ingrese la contraseña de administrador:"); if(clave===null||clave==="")return;
 $("estado").innerHTML="<p>Validando acceso...</p>";
 try{const r=await fetch(URL_SCRIPT,{method:"POST",body:JSON.stringify({accion:"VALIDAR_ADMIN",clave})});const d=await r.json();
 if(d.ok){sessionStorage.setItem("adminToken",d.token);location.href="admin.html";}else{alert("Contraseña incorrecta");$("estado").innerHTML="";}}
 catch(e){alert("No se pudo validar el acceso");$("estado").innerHTML="";}
}
function mostrarManual(){modoIngreso="MANUAL";$("btnEscanear").disabled=true;$("btnManual").disabled=true;$("manual").style.display="block";}
function buscarManual(){const dni=$("dniManual").value.trim();if(!/^\d{7,8}$/.test(dni)){$('resultado').innerHTML='<h3>Ingrese un DNI válido.</h3>';return;}$("dni").value=dni;buscarDni();}
function extraerDni(t){const c=String(t).split("@").map(v=>v.trim()).filter(v=>/^\d{7,8}$/.test(v));return c.length?c[c.length-1]:"";}
function iniciarCamara(){modoIngreso="DNI";$("btnManual").disabled=true;$("btnEscanear").disabled=true;$("reader").style.display="block";$("estado").innerHTML='<h3>Escaneando DNI...</h3>';codeReader=new ZXing.BrowserMultiFormatReader();codeReader.decodeFromVideoDevice(null,"reader",r=>{if(!r)return;const dni=extraerDni(r.text||(r.getText?r.getText():""));if(!dni)return;$("dni").value=dni;codeReader.reset();$("reader").style.display="none";buscarDni();});}
async function iniciarSelfie(){$("zonaSelfie").style.display="block";$("videoSelfie").style.display="block";streamSelfie=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:240},height:{ideal:180}},audio:false});$("videoSelfie").srcObject=streamSelfie;}
function capturarSelfie(){const c=$("canvasSelfie"),v=$("videoSelfie");c.getContext("2d").drawImage(v,0,0,160,120);const img=c.toDataURL("image/jpeg",.25);fotoBase64=img.split(",")[1];$("previewSelfie").src=img;$("previewSelfie").hidden=false;$("selfieLista").hidden=false;v.style.display="none";$("btnTomarSelfie").disabled=true;if(streamSelfie)streamSelfie.getTracks().forEach(t=>t.stop());}
function buscarDni(){const dni=$("dni").value;$("estado").innerHTML='<h3>Buscando invitado...</h3>';fetch(URL_SCRIPT+'?dni='+encodeURIComponent(dni)).then(r=>r.json()).then(d=>{$("estado").innerHTML="";if(!d.encontrado){$('resultado').innerHTML='<h3>DNI no autorizado</h3>';return;}$("opciones").style.display="none";$("manual").style.display="none";$("datosInvitado").innerHTML='<h3>Datos encontrados</h3><p><strong>Nombre:</strong> '+d.nombre+'</p><p><strong>DNI:</strong> '+d.dni+'</p>';if(modoIngreso==="MANUAL")iniciarSelfie();$("resultado").innerHTML='<button id="btnAsiste">Asistiré</button><br><br><button id="btnNoAsiste">No asistiré</button>';$("btnAsiste").onclick=()=>responder(d.dni,"ASISTE");$("btnNoAsiste").onclick=()=>responder(d.dni,"NO ASISTE");}).catch(()=>{$('estado').innerHTML='';$('resultado').innerHTML='<h3>Error al consultar DNI.</h3>';});}
function responder(dni,asistencia){if(modoIngreso==="MANUAL"&&!fotoBase64){alert("Debe tomar una selfie.");return;}$("estado").innerHTML='<h3>Guardando respuesta...</h3>';fetch(URL_SCRIPT,{method:"POST",body:JSON.stringify({dni,asistencia,modoIngreso,foto:fotoBase64})}).then(r=>r.json()).then(d=>{$("estado").innerHTML="";if(d.ok){$('datosInvitado').innerHTML='';$('zonaSelfie').style.display='none';$('resultado').innerHTML='<h2>Gracias</h2><p>Su respuesta fue registrada correctamente.</p>';}else if(d.mensaje==='YA_RESPONDIO'){$('resultado').innerHTML='<h3>Este DNI ya registró una respuesta.</h3>';}else{$('resultado').innerHTML+='<h3>Error: '+(d.error||d.mensaje)+'</h3>';}}).catch(()=>{$('estado').innerHTML='';$('resultado').innerHTML+='<h3>Error de conexión.</h3>';});}
</script></body></html>
